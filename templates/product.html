<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products - My Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="logo">MyStore</div>
        <ul class="nav-links">
            <li><a href="{{ url_for('home') }}">Home</a></li>
            <li><a href="{{ url_for('products') }}">Products</a></li>
            <li><a href="{{ url_for('cart') }}">Cart 🛒</a></li>
        </ul>
    </nav>

    <section class="catalog">
        <h2>Our Collection</h2>
        <div class="product-grid">
            <div class="product-card">
                <img src="https://via.placeholder.com/250" alt="T-Shirt">
                <h3>Classic T-Shirt</h3>
                <p>₹499</p>
                <a href="{{ url_for('product_details', product_id=1) }}"><button>View Details</button></a>
            </div>
            <div class="product-card">
                <img src="https://via.placeholder.com/250" alt="Mug">
                <h3>Ceramic Coffee Mug</h3>
                <p>₹299</p>
                <a href="{{ url_for('product_details', product_id=2) }}"><button>View Details</button></a>
            </div>
        </div>
    </section>
</body>
</html>
